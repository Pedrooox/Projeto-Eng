<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmácia - Gestão de Medicamentos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-secondary { background-color: #64748b; color: white; display: none; }

        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        th { background-color: #f8fafc; }

        .actions { display: flex; gap: 6px; }
        .btn-action { padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; }
        .btn-edit { background-color: #e2e8f0; color: #334155; }
        .btn-delete { background-color: #fee2e2; color: var(--danger); }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.875rem;
            display: none;
        }
        .alert-success { background-color: #dcfce7; color: #166534; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Farmácia - Balcão</h1>
        <p>Painel de Controlo e Teste do CRUD de Medicamentos</p>
    </header>

    <div id="feedback-alert" class="alert"></div>

    <div class="grid-layout">
        <!-- Formulário -->
        <div class="card">
            <h2 id="form-title">Cadastrar Medicamento</h2>
            <form id="form-medicamento">
                <div class="form-group">
                    <label for="nome_comercial">Nome Comercial *</label>
                    <input type="text" id="nome_comercial" required placeholder="Ex: Tylenol">
                </div>
                <div class="form-group">
                    <label for="nome_generico">Nome Genérico</label>
                    <input type="text" id="nome_generico" placeholder="Ex: Paracetamol">
                </div>
                <div class="form-group">
                    <label for="unidade_medida">Unidade de Medida *</label>
                    <input type="text" id="unidade_medida" required placeholder="Ex: 500mg">
                </div>
                <div class="form-group">
                    <label for="validade">Validade *</label>
                    <input type="date" id="validade" required>
                </div>
                <div class="form-group">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" step="0.01" min="0.01" required placeholder="0.00">
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn-primary" id="btn-salvar">Salvar</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar" onclick="limparFormulario()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Tabela -->
        <div class="card">
            <h2>Catálogo no Banco de Dados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cód.</th>
                            <th>Comercial</th>
                            <th>Genérico</th>
                            <th>Unid.</th>
                            <th>Validade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                        <tr><td colspan="7" style="text-align: center;">A carregar...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let editandoCodigo = null;

    document.addEventListener("DOMContentLoaded", carregarMedicamentos);

    const form = document.getElementById("form-medicamento");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const dados = {
            nome_comercial: document.getElementById("nome_comercial").value,
            nome_generico: document.getElementById("nome_generico").value,
            unidade_medida: document.getElementById("unidade_medida").value,
            validade: document.getElementById("validade").value,
            preco: Number(document.getElementById("preco").value)
        };

        try {
            let resposta;
            if (editandoCodigo === null) {
                resposta = await fetch("/Cadatro_medicamento", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
            } else {
                resposta = await fetch(`/Alterar_medicamento/${editandoCodigo}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
            }

            const resultado = await resposta.json();
            if (resposta.ok) {
                mostrarAlerta(resultado.message || "Sucesso!", "success");
                limparFormulario();
                carregarMedicamentos();
            } else {
                mostrarAlerta(resultado.erro || resultado.error || "Erro ao processar.", "error");
            }
        } catch (erro) {
            mostrarAlerta("Erro de conexão com o servidor.", "error");
        }
    });

    async function carregarMedicamentos() {
        try {
            const resposta = await fetch("/Listar_medicamento");
            const medicamentos = await resposta.json();
            const tbody = document.getElementById("tabela-corpo");
            tbody.innerHTML = "";

            if (!Array.isArray(medicamentos) || medicamentos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">Nenhum medicamento registado.</td></tr>`;
                return;
            }

            medicamentos.forEach(med => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>#${med.codigo}</td>
                    <td><strong>${med.nome_comercial}</strong></td>
                    <td>${med.nome_generico || '-'}</td>
                    <td>${med.unidade_medida}</td>
                    <td>${med.validade}</td>
                    <td>R$ ${Number(med.preco).toFixed(2)}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-action btn-edit" onclick="prepararEdicao(${med.codigo}, '${med.nome_comercial}', '${med.nome_generico || ''}', '${med.unidade_medida}', '${med.validade}', ${med.preco})">Editar</button>
                            <button class="btn-action btn-delete" onclick="deletarMedicamento(${med.codigo})">Excluir</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (erro) {
            document.getElementById("tabela-corpo").innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Erro ao carregar dados.</td></tr>`;
        }
    }

    function prepararEdicao(codigo, comercial, generico, unidade, validade, preco) {
        editandoCodigo = codigo;
        document.getElementById("form-title").innerText = `Editar Medicamento #${codigo}`;
        document.getElementById("btn-salvar").innerText = "Atualizar";
        document.getElementById("btn-cancelar").style.display = "block";

        document.getElementById("nome_comercial").value = comercial;
        document.getElementById("nome_generico").value = generico === 'null' ? '' : generico;
        document.getElementById("unidade_medida").value = unidade;
        document.getElementById("validade").value = validade;
        document.getElementById("preco").value = preco;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function limparFormulario() {
        editandoCodigo = null;
        document.getElementById("form-title").innerText = "Cadastrar Medicamento";
        document.getElementById("btn-salvar").innerText = "Salvar";
        document.getElementById("btn-cancelar").style.display = "none";
        document.getElementById("form-medicamento").reset();
    }

    async function deletarMedicamento(codigo) {
        if (!confirm(`Deseja excluir o medicamento #${codigo}?`)) return;

        try {
            const resposta = await fetch(`/Deletar_medicamento/${codigo}`, { method: "DELETE" });
            const resultado = await resposta.json();
            if (resposta.ok) {
                mostrarAlerta(resultado.message || "Removido!", "success");
                carregarMedicamentos();
            } else {
                mostrarAlerta(resultado.erro || "Erro ao excluir.", "error");
            }
        } catch (erro) {
            mostrarAlerta("Erro de conexão.", "error");
        }
    }

    function mostrarAlerta(msg, tipo) {
        const alerta = document.getElementById("feedback-alert");
        alerta.innerText = msg;
        alerta.className = `alert alert-${tipo}`;
        alerta.style.display = "block";
        setTimeout(() => { alerta.style.display = "none"; }, 4000);
    }
</script>

</body>
</html>
